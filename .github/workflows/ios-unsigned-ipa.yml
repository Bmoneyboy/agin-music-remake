name: Build unsigned iOS IPA

# Produces an UNSIGNED .ipa as a workflow artifact. It cannot be installed
# directly - sign it on your PC with Sideloadly or AltStore, which will resign
# it with your own Apple ID.
#
# Requires no Apple Developer Program membership. Note that free personal-team
# signing cannot use App Groups, CarPlay or push entitlements, and the installed
# app expires after 7 days.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # macos-26 (Xcode 26.x) is required: Expo SDK 55's expo-modules-core uses
    # isolated protocol conformances (`extension UIView: @MainActor ...`), which
    # is Swift 6.2 syntax. The Xcode 16.4 on macos-15 fails with
    # "unknown attribute 'MainActor'".
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          ls -1 /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          swift --version

      - name: Free disk space and report resources
        run: |
          echo "=== before ==="
          df -h /
          # The image ships several Xcodes and simulator runtimes we never use.
          # An RN + Pods + DerivedData build can otherwise exhaust the volume,
          # which kills the compiler with no error message.
          KEEP=$(xcode-select -p | sed 's|/Contents/Developer||')
          echo "Keeping $KEEP"
          for app in /Applications/Xcode*.app; do
            [ "$app" = "$KEEP" ] || sudo rm -rf "$app"
          done
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          xcrun simctl delete unavailable 2>/dev/null || true
          echo "=== after ==="
          df -h /
          echo "=== memory ==="
          sysctl -n hw.memsize hw.ncpu

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # patch-package runs on postinstall and is required, so scripts stay on.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native iOS project
        env:
          # Must differ from the upstream bundle id or signing will collide.
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.example.aginmusic' }}
        run: npx expo prebuild --platform ios --clean

      - name: Resolve workspace and scheme
        id: xc
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Building scheme '$SCHEME' from '$WORKSPACE'"

      - name: Build unsigned archive
        run: |
          set -o pipefail
          # xcpretty is not guaranteed on newer images; fall back gracefully so a
          # missing formatter never masks a real compile failure.
          if command -v xcbeautify >/dev/null 2>&1; then FMT=xcbeautify
          elif command -v xcpretty  >/dev/null 2>&1; then FMT=xcpretty
          else FMT=cat; fi

          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee xcodebuild.log | $FMT

      - name: Surface build errors
        if: failure()
        run: |
          echo "::group::Resources at failure"
          df -h /
          vm_stat | head -5
          echo "::endgroup::"

          echo "::group::Failure lines"
          grep -nEi "error:|\\*\\* BUILD FAILED|The following build commands failed|failed with a nonzero exit code|No space left on device|Segmentation fault|Killed|signal [0-9]+|out of memory|Abort trap" -A 5 xcodebuild.log \
            | tail -n 200 \
            || echo "NO failure markers found - the compiler was almost certainly killed by the OS (disk or memory), not a code error."
          echo "::endgroup::"

          echo "::group::Last 150 lines"
          tail -n 150 xcodebuild.log
          echo "::endgroup::"

      - name: Build a warning-free log for sharing
        if: always()
        run: |
          # Strip the warning/note noise so the artifact is small enough to read.
          grep -vEi "warning:|note:|^ *[0-9]+ \\||^ *\\||~\\^|^ *\\^" xcodebuild.log > xcodebuild-signal.log || true
          wc -l xcodebuild.log xcodebuild-signal.log

      - name: Upload raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            xcodebuild-signal.log
          retention-days: 14

      - name: Package as IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)
          echo "Packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AginMusic-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AginMusic-unsigned-ipa
          path: AginMusic-unsigned.ipa
          retention-days: 14
