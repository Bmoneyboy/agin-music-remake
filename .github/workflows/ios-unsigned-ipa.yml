name: Build unsigned iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci-build-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-output
          path: out
          retention-days: 14
